<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>60fps HQ Wavy Video with Border Noise</title>
    <style>
        body { margin: 0; background-color: #050505; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; cursor: pointer; }
        canvas { max-width: 100%; max-height: 100%; background-color: #000; image-rendering: high-quality; }
        video { display: none; }
        #recordBtn { position: absolute; top: 20px; left: 20px; padding: 12px 24px; background-color: #ffffff; color: #000000; border: none; border-radius: 8px; font-family: sans-serif; font-size: 16px; font-weight: bold; cursor: pointer; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.5); transition: background-color 0.3s; }
        #recordBtn.recording { background-color: #ff3333; color: white; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <button id="recordBtn">Record Full Clip</button>
    <video id="sourceVideo" src="video3.mp4" autoplay loop muted playsinline crossorigin="anonymous"></video>
    <canvas id="displayCanvas" width="1080" height="1920"></canvas>

    <script>
        const video = document.getElementById('sourceVideo');
        const canvas = document.getElementById('displayCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";

        video.play().catch(e => console.log("Clicca lo schermo..."));
        document.body.addEventListener('click', (e) => { if (e.target.id !== 'recordBtn') video.play(); }, { once: true });

        // --- SISTEMA DI REGISTRAZIONE OTTIMIZZATO ---
        const recordBtn = document.getElementById('recordBtn');
        let isRecording = false;

        recordBtn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            if (isRecording) return;
            isRecording = true;
            
            recordBtn.classList.add('recording');
            recordBtn.innerText = "Recording...";

            // Sincronizzazione: reset video e avvio
            video.pause();
            video.currentTime = 0;
            video.play();

            // Cattura stream senza forzare FPS per evitare lag
            const stream = canvas.captureStream(); 
            const mediaRecorder = new MediaRecorder(stream, { 
                mimeType: 'video/mp4; codecs="avc1.42E01E"',
                videoBitsPerSecond: 30000000 
            });
            const chunks = [];

            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = "final_render.mp4";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                isRecording = false;
                recordBtn.classList.remove('recording');
                recordBtn.innerText = "Record Full Clip";
            };

            mediaRecorder.start();

            // Fermo automatico a fine video
            const checkEnd = setInterval(() => {
                if (video.ended || video.currentTime >= video.duration - 0.1) {
                    mediaRecorder.stop();
                    clearInterval(checkEnd);
                }
            }, 100);
        });

        // --- LOGICA ANIMAZIONE ---
        const BLOCK_SIZE = 30; 
        const cols = Math.ceil(canvas.width / BLOCK_SIZE); 
        const rows = Math.ceil(canvas.height / BLOCK_SIZE); 
        const offCtx = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
        offCtx.canvas.width = cols; offCtx.canvas.height = rows;

        const baseImages = [], colorImages = [];
        for (let i = 1; i <= 11; i++) {
            const img = new Image();
            img.src = `img2/${i}.png`;
            img.onload = () => { if (++loaded === 11) requestAnimationFrame(animate); };
            if (i <= 5) baseImages.push(img); else colorImages.push(img);
        }
        let loaded = 0;

        function getNoise(x, y, t) {
            return (Math.sin(x*0.12+t*1.1) + Math.sin((y-t*5)*0.15) + Math.sin((x+y)*0.09+t*1.3) + Math.cos((x-y)*0.06-t*0.8) + 4) / 8;
        }

        function animate() {
            requestAnimationFrame(animate);
            if (video.readyState < 2) return;
            const time = Date.now() * 0.002;
            offCtx.drawImage(video, 0, 0, cols, rows);
            const data = offCtx.getImageData(0, 0, cols, rows).data;
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < rows; y++) {
                let edge = Math.pow(Math.max(0, 1 - Math.min(y, rows-1-y)/(rows*0.35)), 1.3);
                for (let x = 0; x < cols; x++) {
                    const i = (y * cols + x) * 4;
                    const bright = (0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2]);
                    if (bright < 30) continue;
                    
                    let useColor = (data[i+1] - (data[i]*0.5 + data[i+2]*0.5) > 35) || (edge > 0 && getNoise(x, y, time) * edge > 0.4);
                    let arr = useColor ? colorImages : baseImages;
                    let idx = Math.max(0, Math.min(Math.floor(((bright - 30) / 225) * arr.length), arr.length - 1));
                    ctx.drawImage(arr[idx], x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
                }
            }
        }
    </script>
</body>
</html>
