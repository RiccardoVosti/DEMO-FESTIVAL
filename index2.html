<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Hope: The Bright Side</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <style>
    body { margin: 0; background: #030308; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
  </style>
</head>
<body>

<script>
let cols = 16, rows = 12;
let smoothX, smoothY;
const ease = 0.04;

function setup() {
  createCanvas(windowWidth, windowHeight);
  smoothX = width / 2;
  smoothY = height / 2;
  colorMode(HSB, 360, 100, 100, 1);
}

function draw() {
  // Scia con effetto di dissolvenza profonda
  background(240, 80, 2, 0.15); 

  let targetX = mouseX || width / 2;
  let targetY = mouseY || height / 2;
  smoothX += (targetX - smoothX) * ease;
  smoothY += (targetY - smoothY) * ease;

  for (let x = 0; x < cols; x++) {
    for (let y = 0; y < rows; y++) {
      let posX = map(x, 0, cols - 1, width * 0.1, width * 0.9);
      let posY = map(y, 0, rows - 1, height * 0.1, height * 0.9);
      
      let d = dist(smoothX, smoothY, posX, posY);
      let influence = map(d, 0, 800, 1, 0, true);
      
      // MOVIMENTO ORGANICO
      let breath = sin(frameCount * 0.03 + (x * 0.2) + (y * 0.2)) * 15 * influence;
      
      // PALETTE SPECIALE: 
      // 240, 80, 10 (Deep Night) -> 40, 90, 100 (Sun/Hope)
      let h = lerp(240, 45, influence);
      let s = lerp(90, 80, influence);
      let b = lerp(20, 100, influence);

      // RENDERING GLOW (Effetto Aura)
      noStroke();
      // Aura esterna diffusa
      fill(h, s, b, 0.05 * influence);
      ellipse(posX, posY + breath, 150 * influence);
      
      // Bagliore centrale
      fill(h, s, b, 0.3);
      ellipse(posX, posY + breath, 60 * influence);
      
      // Nucleo brillante (il "Bright Side")
      fill(0, 0, 100, influence);
      ellipse(posX, posY + breath, 10 + (influence * 15));
    }
  }
}

function windowResized() { resizeCanvas(windowWidth, windowHeight); }
</script>
</body>
</html>
